[package]
name = "demo-app"
description = "The app Raywright tests itself against: Win32 controls (UI Automation) and a canvas it draws itself (bridge)"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
raywright-bridge.workspace = true
raywright-protocol.workspace = true
serde_json.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
